<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抽样定理 · sinc 内插复原</title>
<style>
  :root{
    --bg:#080c12; --panel:#0d131c; --panel2:#0a1119; --line:#1f2a38;
    --text:#e6edf3; --muted:#7d8b9c; --accent:#4cc9f0; --accent2:#4361ee;
    --orig:#ffd166; --err:#ff5d8f; --ok:#4ade80; --bad:#ff7a9c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
    overflow:auto;
  }
  .app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

  .hdr{
    flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .logo{width:9px;height:9px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,#4cc9f0,#b57bff);
    box-shadow:0 0 10px rgba(76,201,240,.8);}
  .hdr h1{font-size:13.5px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
  .hdr .sub{font-size:11px;color:var(--muted);white-space:nowrap}
  .hdr .eq{
    margin-left:auto;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--accent);white-space:nowrap;padding:4px 10px;border:1px solid var(--line);
    border-radius:8px;background:#080d14;
  }
  .ghost{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:5px 11px;border-radius:8px;font:12px inherit;cursor:pointer;
    transition:.15s;font-family:inherit;white-space:nowrap;
  }
  .ghost:hover{color:var(--text);border-color:#35455c;background:#161f2b}
  .ghost.on{color:#04121c;background:linear-gradient(135deg,#4cc9f0,#4361ee);
    border-color:transparent;font-weight:700}

  .ctl{
    flex:none;display:flex;flex-wrap:wrap;align-items:flex-end;
    gap:12px 22px;padding:11px 14px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .fld{display:flex;flex-direction:column;gap:6px;min-width:0}
  .lbl{font-size:10.5px;color:var(--muted);letter-spacing:.6px;font-weight:600}
  select{
    background:#080d14;border:1px solid var(--line);border-radius:8px;color:var(--text);
    padding:6px 9px;font:12.5px inherit;font-family:inherit;outline:none;min-width:230px;cursor:pointer;
  }
  select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,201,240,.12)}
  .slider{display:flex;flex-direction:column;gap:6px;min-width:250px;flex:1 1 250px}
  .slider .top{display:flex;align-items:baseline;gap:8px}
  .slider .val{font:600 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent)}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;
    background:linear-gradient(90deg,#4cc9f0 0%,#4361ee 100%);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
    border-radius:50%;background:#eaf6ff;border:2px solid #4cc9f0;cursor:pointer;
    box-shadow:0 0 10px rgba(76,201,240,.55)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
    background:#eaf6ff;border:2px solid #4cc9f0;cursor:pointer}
  .checks{display:flex;flex-wrap:wrap;gap:6px 14px}
  .checks label{display:flex;align-items:center;gap:6px;font-size:12px;color:#b7c3d0;
    cursor:pointer;user-select:none;white-space:nowrap}
  .checks input{accent-color:#4cc9f0;width:14px;height:14px;cursor:pointer}

  .stats{
    flex:none;display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;
    padding:9px 14px;background:var(--panel2);border-bottom:1px solid var(--line);
  }
  .stat{
    background:#0b1119;border:1px solid var(--line);border-radius:9px;
    padding:6px 10px;min-width:104px;
  }
  .stat .k{font-size:10px;color:var(--muted);letter-spacing:.4px;white-space:nowrap}
  .stat .v{font:600 13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}
  .stat.good .v{color:var(--ok)}
  .stat.bad .v{color:var(--bad)}
  .badge{
    align-self:center;margin-left:auto;font-size:11.5px;font-weight:700;
    padding:6px 12px;border-radius:20px;border:1px solid transparent;white-space:nowrap;
  }
  .badge.good{color:#062;background:rgba(74,222,128,.9)}
  .badge.bad{color:#3a0016;background:rgba(255,122,156,.92)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:11.5px;color:#a8b4c2;
    padding:7px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}
  .legend span{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .legend i{width:20px;height:0;border-top:2px solid var(--muted);display:inline-block;flex:none}
  .legend i.bar{height:3px;border:0;border-radius:2px}
  .legend i.dash{border-top:2px dashed rgba(120,187,255,.85)}
  .legend em{font-style:normal}
  .legend .tip{flex:1 1 auto;justify-content:flex-end;color:#6d7b8b;font-size:11px}

  .stage{flex:1 1 auto;position:relative;min-height:330px}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <span class="logo"></span>
    <h1>抽样定理 · sinc 内插复原</h1>
    <span class="sub">光信息处理 · 第 8 次课配套演示</span>
    <span class="eq">g(x) ≈ Σₙ g(xₙ) · sinc[(x − xₙ)/X]</span>
  </header>

  <section class="ctl">
    <div class="fld">
      <label class="lbl" for="fnSel">被抽样函数</label>
      <select id="fnSel"></select>
    </div>

    <div class="slider">
      <div class="top">
        <span class="lbl">抽样点数 N</span>
        <span class="val" id="nVal">12</span>
        <span class="lbl" id="nHint">拖动滑块改变样点数目</span>
      </div>
      <input type="range" id="nRange" min="3" max="80" step="1" value="12"
             aria-label="抽样点数 N">
    </div>

    <div class="fld">
      <span class="lbl">显示</span>
      <div class="checks">
        <label><input type="checkbox" id="cSinc" checked> 各内插函数</label>
        <label><input type="checkbox" id="cOnly"> 只显示选中</label>
        <label><input type="checkbox" id="cOrig" checked> 原函数</label>
        <label><input type="checkbox" id="cErr"> 误差</label>
        <label><input type="checkbox" id="cPts" checked> 样点</label>
        <label><input type="checkbox" id="cLens" checked> 放大镜</label>
      </div>
    </div>

    <button class="ghost" id="btnAuto" aria-pressed="false">自动增加样点</button>
    <button class="ghost" id="btnReset">重置</button>
  </section>

  <section class="ctl">
    <div class="fld">
      <label class="lbl" for="ordSel">叠加顺序</label>
      <select id="ordSel" style="min-width:150px">
        <option value="1">从左到右</option>
        <option value="0">按权重从大到小</option>
        <option value="2">从中心向外</option>
      </select>
    </div>

    <div class="slider" style="flex:2 1 300px">
      <div class="top">
        <span class="lbl">已叠加项数 m</span>
        <span class="val" id="mVal">12</span>
        <span class="lbl" id="mMax">/ 12</span>
        <span class="lbl" id="mHint">拉到最右即完整叠加</span>
      </div>
      <input type="range" id="mRange" min="0" max="12" step="1" value="12"
             aria-label="已叠加的内插函数项数">
    </div>

    <button class="ghost" id="btnAcc" aria-pressed="false">逐个叠加 ▶</button>
    <button class="ghost" id="btnAll">全部叠加</button>
  </section>

  <section class="stats">
    <div class="stat"><div class="k">抽样间隔 X</div><div class="v" id="sX">—</div></div>
    <div class="stat"><div class="k">该间隔可支持的带宽 1/(2X)</div><div class="v" id="sNyq">—</div></div>
    <div class="stat"><div class="k">函数最高频率 f<sub>max</sub></div><div class="v" id="sBand">—</div></div>
    <div class="stat"><div class="k">理论最少样点数</div><div class="v" id="sNmin">—</div></div>
    <div class="stat"><div class="k">复原最大偏差</div><div class="v" id="sMax">—</div></div>
    <div class="stat"><div class="k">均方根偏差</div><div class="v" id="sRms">—</div></div>
    <div class="stat"><div class="k">叠加进度 m / N</div><div class="v" id="sProg">—</div></div>
    <div class="badge" id="badge">—</div>
  </section>

  <section class="legend">
    <span><i class="bar" style="background:#ffd166"></i>原函数 g(x)</span>
    <span><i class="dash"></i>各内插函数 g(xₙ)·sinc[(x−xₙ)/X]</span>
    <span><i class="bar" style="background:#9ecbff"></i>选中的内插函数</span>
    <span><i class="bar" style="background:#4cc9f0"></i><em id="lgSum">叠加结果</em></span>
    <span><i class="bar" style="background:#ff5d8f"></i>误差 g(x)−复原</span>
    <span class="tip">点击曲线选定抽样点　·　← → 微调</span>
  </section>

  <main class="stage" id="stage">
    <canvas id="cv" role="img"
      aria-label="抽样定理演示：原函数曲线、各抽样点处的 sinc 内插函数以及它们的叠加结果"></canvas>
  </main>
</div>
<script>
(function(){
  'use strict';

  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var stage=document.getElementById('stage');
  var fnSel=document.getElementById('fnSel'), nRange=document.getElementById('nRange');
  var nVal=document.getElementById('nVal'), nHint=document.getElementById('nHint');
  var cSinc=document.getElementById('cSinc'), cOrig=document.getElementById('cOrig');
  var cErr=document.getElementById('cErr'), cPts=document.getElementById('cPts');
  var cOnly=document.getElementById('cOnly'), cLens=document.getElementById('cLens');
  var ordSel=document.getElementById('ordSel');
  var mRange=document.getElementById('mRange'), mVal=document.getElementById('mVal');
  var mMax=document.getElementById('mMax'), mHint=document.getElementById('mHint');
  var btnAcc=document.getElementById('btnAcc'), btnAll=document.getElementById('btnAll');
  var lgSum=document.getElementById('lgSum');
  var btnAuto=document.getElementById('btnAuto'), btnReset=document.getElementById('btnReset');
  var sX=document.getElementById('sX'), sNyq=document.getElementById('sNyq');
  var sBand=document.getElementById('sBand'), sNmin=document.getElementById('sNmin');
  var sMax=document.getElementById('sMax'), sRms=document.getElementById('sRms');
  var sProg=document.getElementById('sProg');
  var badge=document.getElementById('badge');

  /* ---------- 坐标范围 ---------- */
  var X0=-0.6, X1=0.6, SPAN=X1-X0;          /* 显示窗口（同时也是抽样区间） */
  var Y0=-1.45, Y1=1.45;
  var PAD={l:62,r:24,t:24,b:50};
  var W=900, H=520, DPR=1;
  var MONO='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';

  /* ---------- 被抽样函数 ---------- */
  var TAU=Math.PI*2;
  var FUNCS=[
    { label:'高斯波包 exp(−x²/2σ²)·cos(2πf₀x)　（近似限带）',
      fmax:7.9, fmTxt:'≈7.9（近似）',
      g:function(x){ return Math.exp(-x*x/(2*0.14*0.14))*Math.cos(TAU*4.5*x); } },
    { label:'理想限带脉冲 sinc(12x)　（严格限带，B = 6）',
      fmax:6, fmTxt:'6（严格）',
      g:function(x){ var u=12*x; return u===0?1:Math.sin(Math.PI*u)/(Math.PI*u); } },
    { label:'高斯脉冲 exp(−x²/2σ²)　（近似限带）',
      fmax:4.8, fmTxt:'≈4.8（近似）',
      g:function(x){ return Math.exp(-x*x/(2*0.10*0.10)); } },
    { label:'矩形脉冲　（非限带）',
      fmax:null, fmTxt:'∞（非限带）',
      g:function(x){ return Math.abs(x)<=0.218?1:0; } }
  ];

  var state={ fn:0, N:12, m:12, order:1, selIdx:-1, selAuto:true,
              sinc:true, onlySel:false, orig:true, err:false, pts:true, lens:true };

  /* ---------- 数学 ---------- */
  function sinc(u){ if(u===0) return 1; return Math.sin(Math.PI*u)/(Math.PI*u); }

  function lattice(N){
    var X=SPAN/(N-1), xs=new Float64Array(N);
    for(var i=0;i<N;i++) xs[i]=X0+i*X;
    return {xs:xs, X:X};
  }

  /* 前 m 项内插函数的叠加（部分和），叠加次序由 order 给出 */
  function reconM(x, xs, X, vals, order, m){
    var s=0;
    for(var k=0;k<m;k++){
      var i=order[k], a=vals[i];
      if(a!==0) s+=a*sinc((x-xs[i])/X);
    }
    return s;
  }

  /* 叠加次序：0 权重从大到小　1 从左到右　2 从中心向外 */
  function makeOrder(xs, vals, mode){
    var idx=[], i;
    for(i=0;i<xs.length;i++) idx.push(i);
    if(mode===0){
      idx.sort(function(a,b){
        var d=Math.abs(vals[b])-Math.abs(vals[a]);
        if(d) return d;
        return (Math.abs(xs[a])-Math.abs(xs[b])) || (a-b);
      });
    } else if(mode===2){
      idx.sort(function(a,b){
        var d=Math.abs(xs[a])-Math.abs(xs[b]);
        if(d) return d;
        return (Math.abs(vals[b])-Math.abs(vals[a])) || (a-b);
      });
    }
    return idx;
  }

  /* 默认选中"权重最大的抽样点"（并列时取离原点最近的） */
  function argPeak(xs, vals){
    var best=0, bv=-1, bx=Infinity;
    for(var i=0;i<xs.length;i++){
      var a=Math.abs(vals[i]);
      if(a>bv+1e-12){ bv=a; best=i; bx=Math.abs(xs[i]); }
      else if(a>bv-1e-12 && Math.abs(xs[i])<bx){ best=i; bx=Math.abs(xs[i]); }
    }
    return best;
  }

  /* ---------- 坐标映射 ---------- */
  function px(x){ return PAD.l+(x-X0)/SPAN*(W-PAD.l-PAD.r); }
  function py(y){ return PAD.t+(Y1-y)/(Y1-Y0)*(H-PAD.t-PAD.b); }
  function plotW(){ return Math.round(W-PAD.l-PAD.r); }
  function plotH(){ return Math.round(H-PAD.t-PAD.b); }
  function xAt(j,wpx){ return X0+j/wpx*SPAN; }

  /* ---------- 网格与坐标轴 ---------- */
  function drawGrid(){
    var wpx=plotW(), hpx=plotH(), k, v, p, major;

    ctx.font='11px '+MONO;
    ctx.lineWidth=1;

    /* 竖向网格：每 0.1，标注每 0.2 */
    for(k=-6;k<=6;k++){
      v=k/10; p=Math.round(px(v))+.5; major=(k%2===0);
      ctx.strokeStyle=major?'rgba(255,255,255,.085)':'rgba(255,255,255,.04)';
      ctx.beginPath(); ctx.moveTo(p,PAD.t); ctx.lineTo(p,PAD.t+hpx); ctx.stroke();
      if(major){
        ctx.fillStyle='#7d8b9c'; ctx.textAlign='center'; ctx.textBaseline='top';
        ctx.fillText(v.toFixed(1), p, PAD.t+hpx+9);
      }
    }
    /* 横向网格：每 0.5 */
    for(k=-2;k<=2;k++){
      v=k*0.5; p=Math.round(py(v))+.5;
      ctx.strokeStyle=(k===0)?'rgba(255,255,255,.16)':'rgba(255,255,255,.055)';
      ctx.beginPath(); ctx.moveTo(PAD.l,p); ctx.lineTo(PAD.l+wpx,p); ctx.stroke();
      ctx.fillStyle='#7d8b9c'; ctx.textAlign='right'; ctx.textBaseline='middle';
      ctx.fillText(v.toFixed(1), PAD.l-9, p);
    }
    /* 坐标轴 */
    ctx.strokeStyle='#33414f'; ctx.lineWidth=1;
    var ax=Math.round(py(0))+.5, ay=Math.round(px(0))+.5;
    ctx.beginPath(); ctx.moveTo(PAD.l,ax); ctx.lineTo(PAD.l+wpx,ax); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ay,PAD.t); ctx.lineTo(ay,PAD.t+hpx); ctx.stroke();

    ctx.fillStyle='#5f6d7d'; ctx.textAlign='right'; ctx.textBaseline='top';
    ctx.fillText('x', PAD.l+wpx, PAD.t+hpx+9);
    ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText('g(x)', PAD.l, PAD.t-7);
  }

  /* ---------- 曲线描点 ---------- */
  function traceInto(g, wpx, scale){
    var st=scale||1;
    for(var j=0;j<=wpx;j+=st){
      var q=py(g(xAt(j,wpx)));
      if(j===0) ctx.moveTo(PAD.l+j,q); else ctx.lineTo(PAD.l+j,q);
    }
  }

  /* ---------- 绘制 ---------- */
  function traceSinc(i, a, xs, X, wpx, st){
    for(var j=0;j<=wpx;j+=st){
      var q=py(a*sinc((xAt(j,wpx)-xs[i])/X));
      if(j===0) ctx.moveTo(PAD.l+j,q); else ctx.lineTo(PAD.l+j,q);
    }
  }

  function draw(){ drawFrom(prepare()); }

  function drawFrom(P){
    var f=P.f, xs=P.xs, X=P.X, N=P.N, vals=P.vals, order=P.order, rank=P.rank, m=P.m;
    var i, j, k;

    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#080c12'; ctx.fillRect(0,0,W,H);
    ctx.lineJoin='round'; ctx.lineCap='round';

    drawGrid();
    var wpx=plotW();
    var selI=Math.max(0,Math.min(state.selIdx,N-1));

    /* 各抽样点上的内插函数：尚未叠加的极淡，已叠加的稍亮 */
    if(state.sinc && !state.onlySel){
      var alpha=Math.max(0.07,0.62/Math.sqrt(N));
      var st=Math.max(1,Math.round(wpx/620));
      var a0, a1;
      ctx.lineWidth=1;
      if(m<N){
        ctx.strokeStyle='rgba(120,187,255,'+(alpha*0.28).toFixed(3)+')';
        ctx.beginPath();
        for(k=0;k<N;k++){
          if(rank[k]<m) continue;
          a0=vals[k]; if(a0===0) continue;
          traceSinc(k,a0,xs,X,wpx,st);
        }
        ctx.stroke();
      }
      ctx.strokeStyle='rgba(120,187,255,'+Math.min(0.92,alpha*1.55).toFixed(3)+')';
      ctx.beginPath();
      for(k=0;k<N;k++){
        if(rank[k]>=m) continue;
        a1=vals[k]; if(a1===0) continue;
        traceSinc(k,a1,xs,X,wpx,st);
      }
      ctx.stroke();
    }

    /* 当前选中（放大镜聚焦）的那一个内插函数 */
    if(state.lens || state.onlySel){
      ctx.beginPath(); traceSinc(selI,vals[selI],xs,X,wpx,1);
      ctx.strokeStyle='rgba(158,203,255,.22)'; ctx.lineWidth=7; ctx.stroke();
      ctx.strokeStyle='#9ecbff'; ctx.lineWidth=2; ctx.stroke();
    }

    /* 误差曲线 */
    if(state.err){
      ctx.strokeStyle='#ff5d8f'; ctx.lineWidth=1.6;
      ctx.beginPath();
      for(j=0;j<=wpx;j++){
        var xe=xAt(j,wpx), qe=py(f.g(xe)-reconM(xe,xs,X,vals,order,m));
        if(j===0) ctx.moveTo(PAD.l+j,qe); else ctx.lineTo(PAD.l+j,qe);
      }
      ctx.stroke();
    }

    /* 原函数 */
    if(state.orig){
      ctx.beginPath(); traceInto(f.g,wpx,1);
      ctx.strokeStyle='rgba(255,209,102,.28)'; ctx.lineWidth=7; ctx.stroke();
      ctx.strokeStyle='rgba(255,209,102,.95)'; ctx.lineWidth=1.8; ctx.stroke();
    }

    /* 叠加结果：前 m 个内插函数的部分和 */
    ctx.beginPath();
    for(j=0;j<=wpx;j++){
      var qr=py(reconM(xAt(j,wpx),xs,X,vals,order,m));
      if(j===0) ctx.moveTo(PAD.l+j,qr); else ctx.lineTo(PAD.l+j,qr);
    }
    ctx.strokeStyle='#4cc9f0'; ctx.lineWidth=2.4;
    ctx.shadowColor='rgba(76,201,240,.55)'; ctx.shadowBlur=9;
    ctx.stroke();
    ctx.shadowBlur=0;

    /* 抽样间隔标注 */
    if(xs.length>1){
      var p0=px(xs[0]), p1=px(xs[1]);
      if(p1-p0>18){
        var yy=PAD.t+18;
        ctx.strokeStyle='rgba(255,209,102,.55)'; ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(p0,yy); ctx.lineTo(p1,yy);
        ctx.moveTo(p0,yy-4); ctx.lineTo(p0,yy+4);
        ctx.moveTo(p1,yy-4); ctx.lineTo(p1,yy+4);
        ctx.stroke();
        ctx.font='10.5px '+MONO;
        var lbl='X = '+X.toFixed(4), tw=ctx.measureText(lbl).width;
        var txit=Math.min((p0+p1)/2+9, PAD.l+wpx-tw-14), tyit=yy-13;
        ctx.fillStyle='rgba(8,12,18,.85)';
        ctx.fillRect(txit-4,tyit-1,tw+8,14);
        ctx.fillStyle='#e9c46a'; ctx.textAlign='left'; ctx.textBaseline='top';
        ctx.fillText(lbl,txit,tyit);
      }
    }

    /* 样点 */
    if(state.pts){
      ctx.fillStyle='#ffd166'; ctx.strokeStyle='#080c12'; ctx.lineWidth=1.6;
      for(i=0;i<N;i++){
        ctx.beginPath();
        ctx.arc(px(xs[i]),py(vals[i]),3.2,0,TAU);
        ctx.fill(); ctx.stroke();
      }
    }
    /* 选中样点的标记 */
    ctx.beginPath(); ctx.arc(px(xs[selI]),py(vals[selI]),9.5,0,TAU);
    ctx.strokeStyle='rgba(158,203,255,.28)'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.beginPath(); ctx.arc(px(xs[selI]),py(vals[selI]),7,0,TAU);
    ctx.strokeStyle='rgba(158,203,255,.9)'; ctx.lineWidth=1.8; ctx.stroke();

    drawLens(P, selI);
  }

  /* ---------- 放大视图：只看一个内插函数 ---------- */
  var lensRect=null;

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawLens(P, selI){
    lensRect=null;
    if(!state.lens || W<640) return;

    var xs=P.xs, X=P.X, N=P.N, vals=P.vals, order=P.order, m=P.m;
    var i, j, k, xv, vv;

    /* 窗口宽度：以若干个抽样间隔为准，并限制在显示范围内 */
    var hw=Math.max(0.09, Math.min(0.13, 3.0*X));
    var xa=xs[selI]-hw, xb=xs[selI]+hw;
    if(xa<X0){ xa=X0; xb=X0+2*hw; }
    if(xb>X1){ xb=X1; xa=X1-2*hw; }
    var xlo=xa-0.6*X, xhi=xb+0.6*X;

    var pw=Math.round(Math.min(392, Math.max(248, W*0.34)));
    var ph=Math.round(Math.min(244, Math.max(170, H*0.46)));
    var lx=Math.round(PAD.l+plotW()-pw-14), ly=Math.round(PAD.t+14);
    lensRect={x:lx, y:ly, w:pw, h:ph};

    var pl=50, pr=14, pt=42, pb=22;
    var iw=pw-pl-pr, ih=ph-pt-pb;
    var ix=lx+pl, iy=ly+pt;

    /* 纵轴自适应：只按内插函数与叠加结果定标，让单个 sinc 看得清 */
    var A=0, NS=150;
    for(k=0;k<=NS;k++){
      xv=xa+(xb-xa)*k/NS;
      vv=Math.abs(reconM(xv,xs,X,vals,order,m)); if(vv>A) A=vv;
      if(state.sinc && !state.onlySel){
        for(i=0;i<N;i++){
          if(xs[i]<xlo || xs[i]>xhi) continue;
          vv=Math.abs(vals[i]*sinc((xv-xs[i])/X));
          if(vv>A) A=vv;
        }
      }
      vv=Math.abs(vals[selI]*sinc((xv-xs[selI])/X));
      if(vv>A) A=vv;
    }
    if(!(A>1e-9)) A=1;
    A*=1.16;

    var LX=function(x){ return ix+(x-xa)/(xb-xa)*iw; };
    var LY=function(y){ return iy+ih/2-y/(2*A)*ih; };

    roundRect(lx+.5, ly+.5, pw-1, ph-1, 10);
    ctx.fillStyle='rgba(9,14,21,.95)'; ctx.fill();
    ctx.strokeStyle='rgba(76,201,240,.38)'; ctx.lineWidth=1; ctx.stroke();

    ctx.font='11px '+MONO;
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillStyle='#8fa2b6';
    ctx.fillText('放大视图 · 单个内插函数   ×'+(SPAN/(xb-xa)).toFixed(1), lx+12, ly+10);
    ctx.fillStyle='#9ecbff';
    ctx.fillText('k='+selI+'   x='+xs[selI].toFixed(4)+'   g(x)='+vals[selI].toFixed(4), lx+12, ly+25);

    ctx.save();
    ctx.beginPath(); ctx.rect(ix,iy,iw,ih); ctx.clip();
    ctx.fillStyle='rgba(4,8,13,.7)'; ctx.fillRect(ix,iy,iw,ih);

    /* 邻域各抽样点的位置 */
    ctx.lineWidth=1;
    for(i=0;i<N;i++){
      var cx=LX(xs[i]);
      if(cx<ix-1 || cx>ix+iw+1) continue;
      ctx.strokeStyle=(i===selI)?'rgba(158,203,255,.5)':'rgba(255,255,255,.075)';
      ctx.beginPath(); ctx.moveTo(cx,iy); ctx.lineTo(cx,iy+ih); ctx.stroke();
    }
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(ix,LY(0)); ctx.lineTo(ix+iw,LY(0)); ctx.stroke();

    var st2=2, xx, yy;

    /* 邻域内插函数（淡，只画窗口附近的几条，避免糊成一团） */
    if(state.sinc && !state.onlySel){
      ctx.lineWidth=1; ctx.beginPath();
      for(i=0;i<N;i++){
        if(i===selI || xs[i]<xlo || xs[i]>xhi) continue;
        var ai=vals[i]; if(ai===0) continue;
        for(j=0;j<=iw;j+=st2){
          xx=xa+(xb-xa)*(j/iw);
          yy=LY(ai*sinc((xx-xs[i])/X));
          if(j===0) ctx.moveTo(ix+j,yy); else ctx.lineTo(ix+j,yy);
        }
      }
      ctx.strokeStyle='rgba(120,187,255,.12)'; ctx.stroke();
    }

    /* 叠加结果（作为背景参照） */
    ctx.beginPath();
    for(j=0;j<=iw;j++){
      xx=xa+(xb-xa)*(j/iw);
      yy=LY(reconM(xx,xs,X,vals,order,m));
      if(j===0) ctx.moveTo(ix+j,yy); else ctx.lineTo(ix+j,yy);
    }
    ctx.strokeStyle='rgba(76,201,240,.62)'; ctx.lineWidth=1.6; ctx.stroke();

    /* 样点 */
    ctx.fillStyle='#ffd166';
    for(i=0;i<N;i++){
      if(xs[i]<xa || xs[i]>xb) continue;
      ctx.beginPath(); ctx.arc(LX(xs[i]),LY(vals[i]),2.6,0,TAU); ctx.fill();
    }

    /* 主角：这一个内插函数，画在最上层 */
    var asv=vals[selI];
    ctx.beginPath();
    for(j=0;j<=iw;j++){
      xx=xa+(xb-xa)*(j/iw);
      yy=LY(asv*sinc((xx-xs[selI])/X));
      if(j===0) ctx.moveTo(ix+j,yy); else ctx.lineTo(ix+j,yy);
    }
    ctx.strokeStyle='rgba(158,203,255,.30)'; ctx.lineWidth=8; ctx.stroke();
    ctx.strokeStyle='#a9d6ff'; ctx.lineWidth=2.4; ctx.stroke();

    ctx.beginPath(); ctx.arc(LX(xs[selI]),LY(vals[selI]),5.2,0,TAU);
    ctx.strokeStyle='#a9d6ff'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();

    ctx.font='10px '+MONO;
    ctx.fillStyle='#6d7b8b';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText('+'+A.toFixed(3), ix-7, iy+3);
    ctx.fillText('0', ix-7, LY(0));
    ctx.fillText('-'+A.toFixed(3), ix-7, iy+ih-3);
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(xa.toFixed(4), ix+1, iy+ih+5);
    ctx.fillText(xb.toFixed(4), ix+iw-1, iy+ih+5);
  }

  /* ---------- 指标 ---------- */
  function fmt(v){
    if(v===0) return '0';
    if(v<1e-4) return v.toExponential(1);
    if(v<0.01) return (v*100).toFixed(3)+'%';
    if(v<1) return (v*100).toFixed(2)+'%';
    return (v*100).toFixed(1)+'%';
  }

  /* 一次把当前状态算齐：抽样点、抽样值、叠加次序、叠加项数 */
  function prepare(){
    var f=FUNCS[state.fn];
    var lat=lattice(state.N), xs=lat.xs, X=lat.X, N=xs.length;
    var vals=new Float64Array(N), order, rank, i, m;
    for(i=0;i<N;i++) vals[i]=f.g(xs[i]);
    order=makeOrder(xs,vals,state.order);
    rank=new Int32Array(N);
    for(i=0;i<N;i++) rank[order[i]]=i;
    if(state.selAuto || state.selIdx<0 || state.selIdx>=N) state.selIdx=argPeak(xs,vals);
    m=Math.max(0,Math.min(Math.round(state.m),N));
    return {f:f, xs:xs, X:X, N:N, vals:vals, order:order, rank:rank, m:m};
  }

  function update(){
    var P=prepare(), i;
    var f=P.f, xs=P.xs, X=P.X, N=P.N, vals=P.vals, order=P.order, m=P.m;
    state.m=m;

    var M=560, mx=0, se=0, amp=0;
    for(i=0;i<=M;i++){
      var x=X0+SPAN*i/M, gv=f.g(x), ag=Math.abs(gv);
      if(ag>amp) amp=ag;
      var d=Math.abs(reconM(x,xs,X,vals,order,m)-gv);
      if(d>mx) mx=d;
      se+=d*d;
    }
    var rms=Math.sqrt(se/(M+1));
    if(amp<1e-9) amp=1;

    var Nmin = f.fmax ? Math.ceil(SPAN*2*f.fmax)+1 : null;
    var ok = (Nmin!==null) && (N>=Nmin);

    sX.textContent=X.toFixed(4);
    sNyq.textContent=(1/(2*X)).toFixed(2);
    sBand.textContent=f.fmTxt;
    sNmin.textContent=(Nmin===null)?'—':String(Nmin);
    sMax.textContent=fmt(mx/amp);
    sRms.textContent=fmt(rms/amp);
    sProg.textContent=m+' / '+N;

    badge.className='badge '+(ok?'good':'bad');
    if(Nmin===null) badge.textContent='非限带函数：无法完全复原';
    else if(ok) badge.textContent='满足抽样定理　N ≥ '+Nmin;
    else badge.textContent='欠采样　还差 '+(Nmin-N)+' 个样点';

    nHint.textContent=(Nmin===null)
      ? '非限带：增大 N 只能趋近，不会完全重合'
      : (ok ? '已满足抽样定理' : '理论最少 N = '+Nmin);

    if(mRange.max!==String(N)) mRange.max=String(N);
    if(mRange.value!==String(m)) mRange.value=String(m);
    mVal.textContent=String(m);
    mMax.textContent='/ '+N;
    mHint.textContent=(m>=N) ? 'N 项已全部叠加' : '还差 '+(N-m)+' 项';
    lgSum.textContent=(m>=N) ? '叠加结果（全部 N 项）' : '部分和（已叠加 '+m+'/'+N+' 项）';

    drawFrom(P);
  }

  /* ---------- 交互 ---------- */
  function syncUI(){
    fnSel.value=String(state.fn);
    nRange.value=String(state.N); nVal.textContent=String(state.N);
    mRange.max=String(state.N);   mRange.value=String(state.m);
    mVal.textContent=String(state.m); mMax.textContent='/ '+state.N;
    cSinc.checked=state.sinc; cOnly.checked=state.onlySel;
    cOrig.checked=state.orig; cErr.checked=state.err;
    cPts.checked=state.pts;   cLens.checked=state.lens;
    ordSel.value=String(state.order);
  }

  FUNCS.forEach(function(f,idx){
    var o=document.createElement('option');
    o.value=String(idx); o.textContent=f.label;
    fnSel.appendChild(o);
  });

  function setN(n){
    n=Math.max(3,Math.min(80,Math.round(n)));
    state.N=n; state.m=n;
    nRange.value=String(n); nVal.textContent=String(n);
    if(state.selIdx>=n) state.selIdx=n-1;
    update();
  }

  fnSel.addEventListener('change',function(){
    state.fn=parseInt(fnSel.value,10)||0;
    state.selAuto=true; state.selIdx=-1;   /* 重新选中权重最大的样点 */
    update();
  });
  nRange.addEventListener('input',function(){
    stopAll();
    setN(parseInt(nRange.value,10));
  });
  ordSel.addEventListener('change',function(){
    state.order=parseInt(ordSel.value,10)||0;
    update();
  });
  mRange.addEventListener('input',function(){
    stopAcc();
    state.m=Math.max(0,Math.min(state.N,parseInt(mRange.value,10)||0));
    update();
  });
  cSinc.addEventListener('change',function(){ state.sinc=cSinc.checked; draw(); });
  cOnly.addEventListener('change',function(){ state.onlySel=cOnly.checked; draw(); });
  cOrig.addEventListener('change',function(){ state.orig=cOrig.checked; draw(); });
  cErr.addEventListener('change',function(){ state.err=cErr.checked; draw(); });
  cPts.addEventListener('change',function(){ state.pts=cPts.checked; draw(); });
  cLens.addEventListener('change',function(){ state.lens=cLens.checked; draw(); });

  /* 在曲线上点一下，选中最近的那个抽样点 */
  cv.addEventListener('click',function(ev){
    var r=cv.getBoundingClientRect();
    var mx=ev.clientX-r.left, my=ev.clientY-r.top;
    if(lensRect && mx>=lensRect.x && mx<=lensRect.x+lensRect.w &&
                  my>=lensRect.y && my<=lensRect.y+lensRect.h) return;
    if(mx<PAD.l || mx>PAD.l+plotW()) return;
    var P=prepare(), best=0, bd=Infinity, d;
    var xv=X0+(mx-PAD.l)/plotW()*SPAN;
    for(var i=0;i<P.N;i++){
      d=Math.abs(P.xs[i]-xv);
      if(d<bd){ bd=d; best=i; }
    }
    state.selIdx=best; state.selAuto=false;
    update();
  });
  document.addEventListener('keydown',function(ev){
    if(ev.key!=='ArrowLeft' && ev.key!=='ArrowRight') return;
    var t=ev.target;
    if(t && (t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA')) return;
    var P=prepare();
    var i=state.selIdx+(ev.key==='ArrowRight'?1:-1);
    state.selIdx=Math.max(0,Math.min(P.N-1,i)); state.selAuto=false;
    update();
    ev.preventDefault();
  });

  /* ---------- 动画 ---------- */
  var animTimer=null, animKind=null, nDir=1;

  function stopAuto(){
    if(animTimer && animKind==='n'){ clearTimeout(animTimer); animTimer=null; animKind=null; }
    btnAuto.classList.remove('on');
    btnAuto.setAttribute('aria-pressed','false');
    btnAuto.textContent='自动增加样点';
  }
  function stopAcc(){
    if(animTimer && animKind==='m'){ clearTimeout(animTimer); animTimer=null; animKind=null; }
    btnAcc.classList.remove('on');
    btnAcc.setAttribute('aria-pressed','false');
    btnAcc.textContent='逐个叠加 ▶';
  }
  function stopAll(){ stopAuto(); stopAcc(); }

  function stepAuto(){
    var n=state.N+nDir;
    if(n>=80){ n=80; nDir=-1; }
    else if(n<=3){ n=3; nDir=1; }
    setN(n);
    animTimer=setTimeout(stepAuto,140);
  }
  btnAuto.addEventListener('click',function(){
    if(animKind==='n'){ stopAuto(); return; }
    stopAcc();
    nDir=1; animKind='n';
    btnAuto.classList.add('on');
    btnAuto.setAttribute('aria-pressed','true');
    btnAuto.textContent='停止演示';
    stepAuto();
  });

  function accStep(){
    if(state.m>=state.N){ stopAcc(); return; }
    state.m=Math.min(state.N, state.m+Math.max(1,Math.round(state.N/38)));
    update();
    if(state.m>=state.N){ stopAcc(); return; }
    animTimer=setTimeout(accStep, Math.max(55, 4200/state.N));
  }
  btnAcc.addEventListener('click',function(){
    if(animKind==='m'){ stopAcc(); return; }
    stopAuto();
    if(state.m>=state.N) state.m=0;
    animKind='m';
    btnAcc.classList.add('on');
    btnAcc.setAttribute('aria-pressed','true');
    btnAcc.textContent='暂停 ‖';
    accStep();
  });
  btnAll.addEventListener('click',function(){
    stopAcc();
    state.m=state.N;
    update();
  });
  btnReset.addEventListener('click',function(){
    stopAll();
    state.fn=0; state.N=12; state.m=12; state.order=1;
    state.selIdx=-1; state.selAuto=true;
    state.sinc=true; state.onlySel=false; state.orig=true;
    state.err=false; state.pts=true; state.lens=true;
    syncUI(); update();
  });

  /* ---------- 尺寸 ---------- */
  function resize(){
    var r=stage.getBoundingClientRect();
    var w=Math.round(r.width), h=Math.round(r.height);
    if(w<80||h<80) return;
    DPR=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.round(w*DPR);
    cv.height=Math.round(h*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    W=w; H=h;
    update();
  }
  if(window.ResizeObserver){ new ResizeObserver(resize).observe(stage); }
  window.addEventListener('resize',resize);

  syncUI();
  resize();
  requestAnimationFrame(function(){ setTimeout(resize,80); });
})();
</script>
</body>
</html>
